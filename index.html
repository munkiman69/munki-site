<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Munki — Afro-Celtic fusion from Bristol</title>
  <meta name="description" content="Munki: Bristol-based singer-songwriter and multi-instrumentalist. Afro-Celtic fusion drawing on folk, funk and afrobeat — solo, duo, four-piece or six-piece.">
  <meta property="og:title" content="Munki">
  <meta property="og:description" content="Afro-Celtic fusion from Bristol.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="theme.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="mark" href="#">MUNKI</a>
      <nav aria-label="Main">
        <a href="#watch" data-needs="video">Watch</a>
        <a href="#press" data-needs="press">Press</a>
        <a href="#listen">Listen</a>
        <a href="#book" class="nav-cta">Book Munki</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-photo" id="hero-photo" hidden>
        <img id="photo" alt="" width="2000" height="1339">
      </div>
      <div class="wrap hero-text">
        <a class="badge" id="badge" href="#book" hidden><span class="dot" aria-hidden="true"></span><span id="badge-text"></span></a>
        <p class="eyebrow" id="tagline"></p>
        <p class="presents" id="presents" hidden></p>
        <h1 id="name"></h1>
        <figure class="hero-quote" id="hero-quote" hidden>
          <blockquote id="hero-quote-text"></blockquote>
          <figcaption id="hero-quote-source"></figcaption>
        </figure>
        <p class="lede" id="intro"></p>
        <div class="actions">
          <a class="btn" href="#book">Book a tour date</a>
          <a class="btn btn-ghost" id="listen-btn" href="#listen">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>
            Listen
          </a>
        </div>
      </div>
    </section>

    <section class="wrap block story" id="story" hidden>
      <p class="label" id="story-label"></p>
      <h2 class="section-title" id="story-heading"></h2>
      <div class="story-body" id="story-body"></div>
      <dl class="stats" id="stats" hidden></dl>
      <div class="story-groups" id="story-groups"></div>
    </section>

    <section class="wrap block book" id="book" hidden>
      <p class="label">For promoters, venues &amp; festivals</p>
      <h2 class="section-title" id="book-heading"></h2>
      <p class="book-pitch" id="book-pitch"></p>

      <h3 class="sub">Choose the line-up</h3>
      <ul class="lineup" id="formats"></ul>
      <p class="also" id="also" hidden></p>

      <h3 class="sub">Why book Munki</h3>
      <div class="reasons" id="reasons"></div>

      <div class="enquiries" id="enquiries" hidden>
        <p class="enq-label">For enquiries contact</p>
        <a class="enq-main" id="enq-email" href="#"></a>
        <a class="enq-phone" id="enq-phone" href="#" hidden></a>
      </div>
    </section>

    <section class="wrap block" id="watch" data-needs="video">
      <h2 class="label">Watch</h2>
      <div class="video">
        <iframe id="video" title="Munki video" loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <p class="caption" id="video-title"></p>
    </section>

    <section class="wrap block" id="press" data-needs="press">
      <h2 class="label">Press</h2>
      <div class="quotes" id="quotes"></div>
      <div class="featured" id="featured-wrap" hidden>
        <p class="label">As featured in</p>
        <ul id="featured"></ul>
        <a class="more" id="coverage" href="#" target="_blank" rel="noopener" hidden>Read all coverage →</a>
      </div>
    </section>

    <section class="wrap block" id="listen">
      <h2 class="label">Listen</h2>
      <ul class="links" id="streaming"></ul>
    </section>

    <section class="wrap block" id="contact">
      <h2 class="label">Contact</h2>
      <div class="contact">
        <dl id="contact-list"></dl>
        <ul class="links small" id="social"></ul>
      </div>
    </section>
  </main>

  <footer class="wrap foot">
    <span>© <span id="year"></span> Munki<span id="foot-label"></span></span>
    <span id="location"></span>
  </footer>

  <script>
    (function () {
      var c = window.MUNKI || {};
      var $ = function (id) { return document.getElementById(id); };
      var has = function (v) { return typeof v === "string" && v.trim() !== ""; };
      var link = function (label, url) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = url; a.target = "_blank"; a.rel = "noopener";
        a.innerHTML = '<span></span><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        a.firstChild.textContent = label;
        li.appendChild(a);
        return li;
      };
      var hide = function (key) {
        document.querySelectorAll('[data-needs="' + key + '"]').forEach(function (el) { el.hidden = true; });
      };

      $("name").textContent = c.name || "Munki";
      $("tagline").textContent = c.tagline || "";
      if (has(c.recordLabel)) {
        $("presents").textContent = c.recordLabel + " presents";
        $("presents").hidden = false;
        $("foot-label").textContent = " · " + c.recordLabel;
      }
      $("intro").textContent = c.intro || "";
      $("year").textContent = new Date().getFullYear();
      $("location").textContent = (c.contact && c.contact.location) || "";

      var hq = c.heroQuote || {};
      if (has(hq.quote)) {
        $("hero-quote-text").textContent = "“" + hq.quote.trim() + "”";
        if (has(hq.source)) {
          if (has(hq.url)) {
            var hqa = document.createElement("a");
            hqa.href = hq.url; hqa.target = "_blank"; hqa.rel = "noopener";
            hqa.textContent = hq.source;
            $("hero-quote-source").appendChild(hqa);
          } else { $("hero-quote-source").textContent = hq.source; }
        }
        $("hero-quote").hidden = false;
      }

      if (has(c.photo)) {
        var img = $("photo");
        img.alt = c.photoAlt || c.name || "";
        if (has(c.photoFallback)) {
          img.onerror = function () { img.onerror = null; img.src = c.photoFallback; };
        }
        img.src = c.photo;
        $("hero-photo").hidden = false;
      }

      if (has(c.listenLink)) {
        $("listen-btn").href = c.listenLink;
        $("listen-btn").target = "_blank";
        $("listen-btn").rel = "noopener";
      }

      var embed = (function (u) {
        if (!has(u)) return "";
        u = u.trim();
        var ig = u.match(/instagram\.com\/(?:[\w.]+\/)?(reels?|p|tv)\/([\w-]+)/i);
        if (ig) { $("watch").classList.add("is-reel"); return "https://www.instagram.com/" + (ig[1].toLowerCase() === "p" ? "p" : "reel") + "/" + ig[2] + "/embed/"; }
        var m = u.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([0-9a-f]+))?/i);
        if (m) return "https://player.vimeo.com/video/" + m[1] + (m[2] ? "?h=" + m[2] : "");
        m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
        if (m) return "https://www.youtube-nocookie.com/embed/" + m[1] + "?rel=0&modestbranding=1";
        return /^https:\/\//.test(u) ? u : "";
      })(c.showreel);
      if (embed) {
        $("video").src = embed;
        $("video").title = c.showreelTitle || "Munki showreel";
        $("video-title").textContent = c.showreelTitle || "";
      } else { hide("video"); }

      (c.streaming || []).filter(function (s) { return has(s.url); })
        .forEach(function (s) { $("streaming").appendChild(link(s.label, s.url)); });

      var quotes = (c.press || []).filter(function (p) { return has(p.quote); });
      if (quotes.length) {
        quotes.forEach(function (p) {
          var f = document.createElement("figure");
          var q = document.createElement("blockquote");
          q.textContent = "“" + p.quote.trim() + "”";
          f.appendChild(q);
          if (has(p.source)) {
            var cap = document.createElement("figcaption");
            var srcUrl = has(p.url) ? p.url : c.coverageLink;
            if (has(srcUrl)) {
              var sa = document.createElement("a");
              sa.href = srcUrl; sa.target = "_blank"; sa.rel = "noopener";
              sa.textContent = p.source;
              cap.appendChild(sa);
            } else { cap.textContent = p.source; }
            f.appendChild(cap);
          }
          $("quotes").appendChild(f);
        });
      }

      var feats = (c.featured || []).filter(function (o) { return has(o.label); });
      if (feats.length) {
        feats.forEach(function (o) {
          var li = document.createElement("li");
          var u = has(o.url) ? o.url : c.coverageLink;
          if (has(u)) {
            var a = document.createElement("a");
            a.href = u; a.target = "_blank"; a.rel = "noopener"; a.textContent = o.label;
            li.appendChild(a);
          } else { li.textContent = o.label; }
          $("featured").appendChild(li);
        });
        $("featured-wrap").hidden = false;
      }
      if (has(c.coverageLink)) { $("coverage").href = c.coverageLink; $("coverage").hidden = false; }
      if (!quotes.length && !feats.length) { hide("press"); }

      // ── Tour booking ──
      var bk = c.booking || {};
      var el = function (tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      };
      var st = c.story || {};
      if (has(st.heading)) {
        $("story-label").textContent = st.label || "";
        $("story-heading").textContent = st.heading;
        (st.paragraphs || []).forEach(function (p) { if (has(p)) $("story-body").appendChild(el("p", "", p)); });
        var stats = (st.stats || []).filter(function (s) { return has(s.figure); });
        stats.forEach(function (s) {
          var d = el("div", "stat");
          d.appendChild(el("dt", "", s.label));
          d.appendChild(el("dd", "", s.figure));
          $("stats").appendChild(d);
        });
        if (stats.length) $("stats").hidden = false;
        (st.groups || []).forEach(function (g) {
          var names = (g.names || []).filter(has);
          if (!names.length) return;
          var box = el("div", "story-group");
          box.appendChild(el("p", "sub", g.title));
          var ul = el("ul", "names");
          names.forEach(function (n) { ul.appendChild(el("li", "", n)); });
          box.appendChild(ul);
          $("story-groups").appendChild(box);
        });
        $("story").hidden = false;
      }

      if (has(bk.badge)) { $("badge-text").textContent = bk.badge; $("badge").hidden = false; }
      if (has(bk.heading)) {
        $("book-heading").textContent = bk.heading;
        $("book-pitch").textContent = bk.pitch || "";
        (bk.formats || []).forEach(function (f) {
          var li = el("li", "");
          li.appendChild(el("span", "lu-name", f.name));
          li.appendChild(el("span", "lu-detail", f.detail));
          $("formats").appendChild(li);
        });
        if (has(bk.alsoAvailable)) { $("also").textContent = bk.alsoAvailable; $("also").hidden = false; }
        (bk.reasons || []).forEach(function (r) {
          var card = el("div", "reason");
          card.appendChild(el("p", "reason-title", r.title));
          card.appendChild(el("p", "reason-detail", r.detail));
          $("reasons").appendChild(card);
        });
        $("book").hidden = false;
      }

      var bc = c.contact || {};
      if (has(bc.bookingsEmail)) {
        var em = $("enq-email");
        em.textContent = bc.bookingsEmail;
        if (has(bc.phone)) { $("enq-phone").textContent = bc.phone; $("enq-phone").href = "tel:" + bc.phone.replace(/\s+/g, ""); $("enq-phone").hidden = false; }
        $("enquiries").hidden = false;
      }

      var ct = c.contact || {};
      var rows = [
        ["Bookings", ct.bookingsEmail, "mailto:"],
        ["Press", ct.pressEmail, "mailto:"],
        ["Phone", ct.phone, "tel:"],
      ];
      rows.forEach(function (r) {
        if (!has(r[1])) return;
        var dt = document.createElement("dt"); dt.textContent = r[0];
        var dd = document.createElement("dd");
        var a = document.createElement("a");
        a.href = r[2] + r[1].replace(/\s+/g, ""); a.textContent = r[1];
        dd.appendChild(a);
        $("contact-list").appendChild(dt); $("contact-list").appendChild(dd);
      });

      (c.social || []).filter(function (s) { return has(s.url); })
        .forEach(function (s) { $("social").appendChild(link(s.label, s.url)); });
    })();
  </script>
</body>
</html>
